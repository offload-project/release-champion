name: Release

on:
  pull_request:
    types: [ closed ]
    
permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: ./
        id: release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          draft-release: false
      - name: Update floating major tag
        if: steps.release.outputs.tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          # The release tag is created via the GitHub API (see scripts/tag.sh), so it
          # doesn't exist in this clone. Move the major tag through the API as well,
          # pointing it at the same commit the release tag was created on.
          major=$(echo "$TAG" | grep -oE '^v[0-9]+')
          sha=$(git rev-parse HEAD)
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${major}" > /dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${major}" \
              -f sha="$sha" -F force=true > /dev/null
          else
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${major}" -f sha="$sha" > /dev/null
          fi
          echo "Moved ${major} to ${TAG} (${sha})"

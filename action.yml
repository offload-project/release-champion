name: 'Release Champion'
description: 'Automated semantic versioning and releases using conventional commits'
branding:
  icon: 'package'
  color: 'red'

inputs:
  github-token:
    description: 'GitHub token for creating PRs, tags, and releases'
    required: true
  release-label:
    description: 'Label that marks a PR for release'
    required: false
    default: 'change-release'
  require-release-label:
    description: 'Require the release label to trigger a release PR. When false, every merged PR triggers a release.'
    required: false
    default: 'false'
  version-prefix:
    description: 'Prefix for version tags (e.g., "v" produces "v1.2.3")'
    required: false
    default: 'v'
  create-tag:
    description: 'Create a git tag when the release PR is merged'
    required: false
    default: 'true'
  create-release:
    description: 'Create a GitHub release when the release PR is merged'
    required: false
    default: 'true'
  draft-release:
    description: 'Create the GitHub release as a draft (unpublished)'
    required: false
    default: 'true'
  changelog:
    description: 'Generate or update CHANGELOG.md in the release PR'
    required: false
    default: 'true'
  publish-npm:
    description: 'Publish the package to an npm registry when the release PR is merged'
    required: false
    default: 'false'
  npm-token:
    description: 'Auth token for the npm registry. If omitted and the workflow grants id-token:write, npm Trusted Publishers (OIDC) is used (requires npm >= 11.5.1). If omitted with no OIDC, the publish relies on existing npm auth (e.g. setup-node with NODE_AUTH_TOKEN) and the action will not write or overwrite .npmrc.'
    required: false
  npm-registry:
    description: 'npm registry URL (e.g., https://npm.pkg.github.com for GitHub Packages)'
    required: false
    default: 'https://registry.npmjs.org'
  npm-build-command:
    description: 'Build command to run before npm publish (e.g., npm run build). Dependencies are installed first with the package manager detected from the lockfile (npm, yarn, pnpm, or bun) using a frozen-lockfile install.'
    required: false
  npm-workspaces:
    description: 'Publish every npm workspace package (monorepo, fixed/locked versioning). All packages share the single computed version. Discovered from the root package.json "workspaces" field.'
    required: false
    default: 'false'

outputs:
  version:
    description: 'The new version string (e.g., "1.2.3")'
    value: ${{ steps.run.outputs.version }}
  release-pr:
    description: 'URL of the created release PR (Phase 1)'
    value: ${{ steps.run.outputs.release_pr }}
  tag:
    description: 'The created tag name (Phase 2)'
    value: ${{ steps.run.outputs.tag }}
  release-url:
    description: 'URL of the created GitHub release (Phase 2)'
    value: ${{ steps.run.outputs.release_url }}

runs:
  using: 'composite'
  steps:
    - name: Run Release Champion
      id: run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        INPUT_RELEASE_LABEL: ${{ inputs.release-label }}
        INPUT_REQUIRE_RELEASE_LABEL: ${{ inputs.require-release-label }}
        INPUT_VERSION_PREFIX: ${{ inputs.version-prefix }}
        INPUT_CREATE_TAG: ${{ inputs.create-tag }}
        INPUT_CREATE_RELEASE: ${{ inputs.create-release }}
        INPUT_DRAFT_RELEASE: ${{ inputs.draft-release }}
        INPUT_CHANGELOG: ${{ inputs.changelog }}
        INPUT_PUBLISH_NPM: ${{ inputs.publish-npm }}
        INPUT_NPM_TOKEN: ${{ inputs.npm-token }}
        INPUT_NPM_REGISTRY: ${{ inputs.npm-registry }}
        INPUT_NPM_BUILD_COMMAND: ${{ inputs.npm-build-command }}
        INPUT_NPM_WORKSPACES: ${{ inputs.npm-workspaces }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        PR_MERGED: ${{ github.event.pull_request.merged }}
        PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        REPO: ${{ github.repository }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: bash "${{ github.action_path }}/scripts/main.sh"
